<label for="csv_file">Jira CSV</label><input id="csv_file" type="file" name="csv_file" accept=".csv" required>
<div class="grid"><div><label for="from_date">From</label><input id="from_date" type="date" name="from_date" value="{{ default_from_date }}"></div><div><label for="to_date">To</label><input id="to_date" type="date" name="to_date" value="{{ default_to_date }}"></div>{% if show_sprint %}<div><label for="sprint">Sprints</label><select id="sprint" name="sprint" multiple size="4" disabled><option value="">Choose a CSV first</option></select></div>{% endif %}</div>
<div class="grid filter-grid"><div><label for="label">Labels</label><select id="label" name="label" multiple size="4" disabled><option value="">Choose a CSV first</option></select></div><div><label for="status">Statuses</label><select id="status" name="status" multiple size="4" disabled><option value="">Choose a CSV first</option></select></div><div><label for="workitem_type">Work item types</label><select id="workitem_type" name="workitem_type" multiple size="4" disabled><option value="">Choose a CSV first</option></select></div></div>
<p id="filter_status" class="filter-status" aria-live="polite">Choose a CSV to load filter options.</p>
