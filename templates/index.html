<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Jira Status Report</title><link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}"></head><body><main><section><h1>JIRA STATUS REPORT</h1><p>Upload a Jira CSV, choose your filters, and download one PDF containing only the matching work items.</p><form action="/generate" method="post" enctype="multipart/form-data"><label for="csv_file">Jira CSV</label><input id="csv_file" type="file" name="csv_file" accept=".csv" required><div class="grid"><div><label for="sprint">Sprints</label><select id="sprint" name="sprint" multiple size="4" disabled><option value="">Choose a CSV first</option></select></div><div><label for="from_date">From</label><input id="from_date" type="date" name="from_date" value="{{ default_from_date }}"></div><div><label for="to_date">To</label><input id="to_date" type="date" name="to_date" value="{{ default_to_date }}"></div></div><div class="grid filter-grid"><div><label for="label">Labels</label><select id="label" name="label" multiple size="4" disabled><option value="">Choose a CSV first</option></select></div><div><label for="status">Statuses</label><select id="status" name="status" multiple size="4" disabled><option value="">Choose a CSV first</option></select></div><div><label for="workitem_type">Work item types</label><select id="workitem_type" name="workitem_type" multiple size="4" disabled><option value="">Choose a CSV first</option></select></div></div><p id="filter_status" class="filter-status" aria-live="polite">Choose a CSV to load filter options.</p><button>Generate &amp; Download Report</button></form></section></main><script>const csvFile=document.getElementById('csv_file');const fromDate=document.getElementById('from_date');const toDate=document.getElementById('to_date');const filterStatus=document.getElementById('filter_status');const filterUrl={{ url_for('filter_options')|tojson }};function syncDateRange(){if(fromDate.value)toDate.min=fromDate.value;else toDate.removeAttribute('min');if(toDate.value&&fromDate.value&&toDate.value<fromDate.value)toDate.value=fromDate.value}function populateSelect(id,values){const select=document.getElementById(id);select.innerHTML='';values.forEach(value=>select.add(new Option(value,value)));select.disabled=false}async function loadFilterOptions(){if(!csvFile.files[0])return;filterStatus.textContent='Loading filter options…';const data=new FormData();data.append('csv_file',csvFile.files[0]);try{const response=await fetch(filterUrl,{method:'POST',body:data});const options=await response.json();if(!response.ok)throw new Error(options.error||'Unable to load filter options.');populateSelect('label',options.labels);populateSelect('sprint',options.sprints);populateSelect('status',options.statuses);populateSelect('workitem_type',options.workitem_types);filterStatus.textContent='Select one or more values. Leave a list empty to include all values. Leave dates blank to include all dates.'}catch(error){filterStatus.textContent=error.message}}csvFile.addEventListener('change',loadFilterOptions);fromDate.addEventListener('change',syncDateRange);syncDateRange();</script></body></html>
