<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Jira Weekly Status Reports</title><link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}"></head><body><main><section><h1>JIRA WEEKLY STATUS REPORTS</h1><p>Upload a Jira CSV to generate separate product-backlog and production-ticket PDFs. Production tickets use the exact <strong>prod</strong> or <strong>firebase</strong> labels.</p><form action="/generate" method="post" enctype="multipart/form-data"><label for="csv_file">Jira CSV</label><input id="csv_file" type="file" name="csv_file" accept=".csv" required><div class="grid"><div><label for="sprint">Sprint</label><select id="sprint" name="sprint" disabled><option value="">Choose a CSV first</option></select></div><div><label for="from_date">From</label><input id="from_date" type="date" name="from_date" value="{{ default_from_date }}" required></div><div><label for="to_date">To</label><input id="to_date" type="date" name="to_date" value="{{ default_to_date }}" required></div></div><div class="grid filter-grid"><div><label for="label">Label</label><select id="label" name="label" disabled><option value="">Choose a CSV first</option></select></div><div><label for="status">Status</label><select id="status" name="status" disabled><option value="">Choose a CSV first</option></select></div><div><label for="workitem_type">Work item type</label><select id="workitem_type" name="workitem_type" disabled><option value="">Choose a CSV first</option></select></div></div><p id="filter_status" class="filter-status" aria-live="polite">Choose a CSV to load filter options.</p><button>Generate &amp; Download Reports</button></form></section></main><script>const csvFile=document.getElementById('csv_file');const fromDate=document.getElementById('from_date');const toDate=document.getElementById('to_date');const filterStatus=document.getElementById('filter_status');const filterUrl={{ url_for('filter_options')|tojson }};const preferredSprint='Sprint 101';function syncDateRange(){toDate.min=fromDate.value;if(toDate.value&&toDate.value<fromDate.value)toDate.value=fromDate.value}function populateSelect(id,values,allLabel,preferred=''){const select=document.getElementById(id);select.innerHTML='';select.add(new Option(allLabel,''));values.forEach(value=>select.add(new Option(value,value)));select.disabled=false;if(values.includes(preferred))select.value=preferred}async function loadFilterOptions(){if(!csvFile.files[0])return;filterStatus.textContent='Loading filter options…';const data=new FormData();data.append('csv_file',csvFile.files[0]);try{const response=await fetch(filterUrl,{method:'POST',body:data});const options=await response.json();if(!response.ok)throw new Error(options.error||'Unable to load filter options.');populateSelect('label',options.labels,'All labels');populateSelect('sprint',options.sprints,'All sprints',preferredSprint);populateSelect('status',options.statuses,'All statuses');populateSelect('workitem_type',options.workitem_types,'All work item types');filterStatus.textContent='Filter options loaded from the CSV.'}catch(error){filterStatus.textContent=error.message}}csvFile.addEventListener('change',loadFilterOptions);fromDate.addEventListener('change',syncDateRange);syncDateRange();</script></body></html>
