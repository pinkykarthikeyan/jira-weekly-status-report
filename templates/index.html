<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Jira Weekly Status Reports</title><link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}"></head><body><main><section><h1>JIRA WEEKLY STATUS REPORTS</h1><p>Upload a Jira CSV to generate separate product-backlog and production-ticket PDFs. Production tickets use the exact <strong>prod</strong> or <strong>firebase</strong> labels.</p><form action="/generate" method="post" enctype="multipart/form-data"><label for="csv_file">Jira CSV</label><input id="csv_file" type="file" name="csv_file" accept=".csv" required><div class="grid"><div><label for="sprint">Sprint</label><input id="sprint" name="sprint" value="Sprint 101"></div><div><label for="from_date">From</label><input id="from_date" type="date" name="from_date" value="{{ default_from_date }}" required></div><div><label for="to_date">To</label><input id="to_date" type="date" name="to_date" value="{{ default_to_date }}" required></div></div><button>Generate &amp; Download Reports</button></form></section></main><script>const fromDate=document.getElementById('from_date');const toDate=document.getElementById('to_date');function syncDateRange(){toDate.min=fromDate.value;if(toDate.value&&toDate.value<fromDate.value)toDate.value=fromDate.value}fromDate.addEventListener('change',syncDateRange);syncDateRange();</script></body></html>
